# IDX self-host stack: Imaging Queensland + The Xray Group on one Linux server
#
# This server runs TWO containers only:
#   * imaging-queensland  -> host 127.0.0.1:3001 -> container :3000
#   * the-xray-group      -> host 127.0.0.1:3002 -> container :3000
# The separate unbranded master instance stays on Railway and is NOT part of
# this file (decided 8 Oct 2026).
#
# Deploy model: PULL. Both images are pinned BY DIGEST from the public Docker Hub
# repository rgmjburns/lightbox-play, so the server fetches exactly the build I
# verified. There is no build step here and no inbound access from my side.
#
# Ports are published on the loopback interface ONLY. Nothing is reachable from
# the network until IDX's own reverse proxy (80/443, TLS) forwards to 127.0.0.1:3001
# / 127.0.0.1:3002. See runbook.md and SECURITY-POSTURE.md.
#
# Secrets: LEADERBOARD_ADMIN_PASSCODE comes from the .env file next to this file
# (see .env.example). It has no default here on purpose, so compose refuses to start
# if it is missing, so the code's built-in fallback passcode can never go live.
#
# Validate before starting:  docker compose config
# Start:                     docker compose up -d
# Logs:                      docker compose logs -f imaging-queensland

name: radgames

x-common: &common
  restart: unless-stopped
  # --- Hardening -------------------------------------------------------------
  # Read-only root filesystem; only the data volume and the /tmp tmpfs are
  # writable. The app writes its SQLite database and snapshots to /app/data.
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  # No Linux capabilities at all. The app only listens on an unprivileged port
  # (3000) and writes to its own data volume, so it needs none.
  # If a future image ever fails to boot with this setting, remove this block and
  # record why. Nothing in the current image requires a capability.
  cap_drop:
    - ALL
  # --- Resource limits (server has 4 GB RAM / 2 vCPU) ------------------------
  mem_limit: 512m
  memswap_limit: 1g
  pids_limit: 256
  cpus: 1.0
  stop_grace_period: 20s
  # Keep log growth bounded on an 80 GB disk.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  # Health = GET / returns HTTP 200. Implemented with Bun itself because the
  # image is based on a slim Debian rootfs that does not guarantee curl or wget;
  # the Bun runtime is always present. See runbook.md §6.
  healthcheck:
    test:
      - CMD
      - bun
      - -e
      - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

services:
  imaging-queensland:
    <<: *common
    image: rgmjburns/lightbox-play@sha256:53d5317d8e62dfca0e3a898efa4e69047a3d0eff87d40927425cc15335faa21c
    container_name: radgames-imaging-queensland
    hostname: imaging-queensland
    environment:
      PORT: "3000"
      HOME: /tmp
      LEADERBOARD_ADMIN_PASSCODE: "${LEADERBOARD_ADMIN_PASSCODE:?set LEADERBOARD_ADMIN_PASSCODE in .env - see .env.example}"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - iq_data:/app/data

  the-xray-group:
    <<: *common
    image: rgmjburns/lightbox-play@sha256:6e188530d393aab96e0b32360a60771bf97d1a7d1ef286c888a311d04d978d54
    container_name: radgames-the-xray-group
    hostname: the-xray-group
    environment:
      PORT: "3000"
      HOME: /tmp
      LEADERBOARD_ADMIN_PASSCODE: "${LEADERBOARD_ADMIN_PASSCODE:?set LEADERBOARD_ADMIN_PASSCODE in .env - see .env.example}"
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - txg_data:/app/data

# Named volumes keep each brand's SQLite database (leaderboard.db + backups/)
# independent of the container, so redeploys and updates never lose it.
# Back them up by volume name, see runbook.md §9.
volumes:
  iq_data:
    name: radgames_iq_data
  txg_data:
    name: radgames_txg_data
