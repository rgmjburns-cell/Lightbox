<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <!-- Icon: stylized "ID" monogram with cross/plus medical symbol -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#008C95"/>
  <text x="20" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="white">iD</text>
  <!-- Medical cross accent -->
  <rect x="35" y="4" width="8" height="8" rx="2" fill="#2D2D2D"/>
  <line x1="37" y1="8" x2="41" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="6" x2="39" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Text -->
  <text x="52" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2D2D2D">Integral</text>
  <text x="52" y="34" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2D2D2D">Diagnostics</text>
</svg>
